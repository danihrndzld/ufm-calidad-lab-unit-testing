[project]
name = "lab-unit-testing"
version = "0.1.0"
description = "Laboratorio de pruebas unitarias - UFM, Calidad y Automatizacion en Ingenieria de Software"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_unit_testing"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
